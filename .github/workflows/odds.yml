name: Odds snapshot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "main (3 credits) or full (+ props/1P, ~6 credits per game)"
        default: "full"
        required: false
      probe:
        description: "Probe exchange / pick'em coverage (true/false)"
        default: "false"
        required: false
  push:
    branches: [main]
    paths:
      - "nhlpipe/odds_api.py"
      - "nhlpipe/kalshi.py"
      - "nhlpipe/underdog.py"
      - "nhlpipe/pull_odds.py"
      - ".github/workflows/odds.yml"

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull odds
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          PROBE=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.probe }}" = "true" ]; then PROBE="--probe"; fi
          python -m nhlpipe.pull_odds "$MODE" $PROBE
      - name: Commit data
        run: |
          git config user.name "nhl-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "odds: snapshot $(TZ=America/New_York date +%F_%H%M)"
          git pull --rebase origin main
          git push
