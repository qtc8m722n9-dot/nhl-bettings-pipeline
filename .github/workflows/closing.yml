name: Closing prices

# Fires ~28 min before each :00 / :30 ET start slot (cron is UTC; the hours
# cover both EDT and EST). The job sleeps until ~10 min before each picked
# game and snapshots it once, then exits when nothing starts within 30 min.
# GitHub often starts scheduled runs 10-20 min late, which this absorbs.
# Weekdays only cover evening slots; Sat/Sun also cover afternoons.
# ~16 short runs/day plus a few minutes of sleep per start slot.
# Kalshi closes are made exact later by the grading job (1-min candles).
on:
  workflow_dispatch:
    inputs:
      all:
        description: "Snapshot every not-yet-started picked game now (spends Odds API credits)"
        default: "false"
        required: false
  push:
    branches: [main]
    paths:
      - "nhlpipe/closing.py"
  schedule:
    - cron: "2,32 21-23 * * *"      # 6:00-8:00 PM ET slots
    - cron: "2,32 0-3 * * *"        # 8:00-10:30 PM ET slots
    - cron: "2,32 15-21 * * 0,6"    # Sat/Sun afternoon slots

permissions:
  contents: write

concurrency:
  group: closing
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Capture closing prices
        run: |
          # push = code change: print the plan only (no Odds API credits spent)
          if [ "${{ github.event_name }}" = "push" ]; then python -m nhlpipe.closing --plan
          elif [ "${{ github.event.inputs.all }}" = "true" ]; then python -m nhlpipe.closing --all; else python -m nhlpipe.closing; fi
      - name: Commit data
        run: |
          git config user.name "nhl-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "closing: $(TZ=America/New_York date +%F_%H%M)"
          # Same-file clashes (e.g. two runs writing today's slate): keep this run's copy.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "push failed after 4 attempts"; exit 1
