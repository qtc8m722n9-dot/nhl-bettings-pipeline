name: Daily data pull

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Date to pull (YYYY-MM-DD, blank = today ET)"
        required: false
  schedule:
    # 10:30 and 13:30 ET (UTC-4 during EDT; shift by 1h after Nov 1 DST end)
    - cron: "30 14 * * *"
    - cron: "30 17 * * *"

permissions:
  contents: write

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull data
        run: python -m nhlpipe.pull_daily ${{ github.event.inputs.day }}
      - name: Commit data
        run: |
          git config user.name "nhl-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: pull $(TZ=America/New_York date +%F_%H%M)"
          # Same-file clashes (e.g. two runs writing today's slate): keep this run's copy.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "push failed after 4 attempts"; exit 1
