name: Grade & scoreboard

# Each morning: grade every finished slate that isn't fully graded yet,
# backfill exact Kalshi closes from 1-minute candles, rebuild
# data/scoreboard.md + data/scoreboard.csv. The second run re-grades anything
# still pending (late games, stat corrections). Cheap: ~1-2 min per run.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Re-grade one date (YYYY-MM-DD); blank = all ungraded"
        required: false
  schedule:
    - cron: "17 12 * * *"   # 8:17 ET (EDT) / 7:17 ET (EST)
    - cron: "17 16 * * *"   # retry for anything still pending

permissions:
  contents: write

concurrency:
  group: grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Grade
        run: python -m nhlpipe.grade ${{ github.event.inputs.day }}
      - name: Commit data
        run: |
          git config user.name "nhl-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "grade: $(TZ=America/New_York date +%F_%H%M)"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "push failed after 4 attempts"; exit 1
