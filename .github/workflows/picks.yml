name: Pick lock

# Pulls fresh stats + goalies + odds, then locks each method's picks for the day.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-generate picks even if already locked (true/false)"
        default: "false"
        required: false
  schedule:
    - cron: "50 17 * * *"   # 12:50 ET (EST, from Nov 2) / 1:50 ET (EDT)

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull stats, goalies, injuries
        run: python -m nhlpipe.pull_daily
      - name: Pull odds (full)
        run: python -m nhlpipe.pull_odds full
      - name: Lock picks
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python -m nhlpipe.run_picks $FORCE
      - name: Commit data
        run: |
          git config user.name "nhl-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "picks: lock $(TZ=America/New_York date +%F_%H%M)"
          # Same-file clashes (e.g. two runs writing today's slate): keep this run's copy.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "push failed after 4 attempts"; exit 1
