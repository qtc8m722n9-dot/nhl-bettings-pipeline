name: probe (temp)
on:
  push:
    branches: [step4-grading]
    paths: ["probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas requests
      - run: python probe.py
      - run: |
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add -f probe_out; git commit -qm "probe output"; git push
