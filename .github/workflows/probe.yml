name: probe (temp)
on:
  push:
    branches: [step4-grading]
    paths: ["probe.py", ".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas requests
      - run: python probe.py
      - uses: actions/upload-artifact@v4
        with: {name: probe_out, path: probe_out}
